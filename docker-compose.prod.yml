# =============================================================================
# Production Docker Compose for jol-auth
# Uses Docker Secrets for sensitive values — secrets are mounted as files
# under /run/secrets/ and read by the application at startup.
#
# Usage:
#   1. Create secrets:
#      echo "your_db_password" | docker secret create jol_db_password -
#      echo "your_app_secret"  | docker secret create jol_app_secret -
#      echo "your_mfa_key"     | docker secret create jol_mfa_encryption_key -
#
#   2. Deploy:
#      docker stack deploy -c docker-compose.prod.yml jol-auth
#
# For Kubernetes, use Kubernetes Secrets with envFrom or secretKeyRef.
# For HashiCorp Vault, use the Vault Agent sidecar injector.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
      restart_policy:
        condition: any
        max_attempts: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Non-secret config via environment
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SKIP_MIGRATIONS: "true"  # Migrations run as a separate job
    secrets:
      - jol_app_secret
      - jol_mfa_encryption_key
      - jol_db_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/jol_db_password
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - jol_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  jol_app_secret:
    external: true
  jol_mfa_encryption_key:
    external: true
  jol_db_password:
    external: true

volumes:
  pgdata:
