[build-system]
requires = ["setuptools>=69.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jol-auth"
version = "0.1.0"
description = "Authentication and identity management for Journey Of Life — OAuth 2.0 / OpenID Connect, multi-tenant RBAC, and session management."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Journey of Life", email = "engineering@journeyoflife.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "pyotp>=2.9",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
]

[tool.setuptools]
packages = ["jol_auth", "app"]
package-dir = {"jol_auth" = "src/jol_auth", "app" = "app"}

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "A", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "src"]
branch = true
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 18
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "starlette.*",
    "fastapi.*",
    "pyotp.*",
    "argon2.*",
    "asyncpg.*",
]
ignore_missing_imports = true
