name: OIDC Conformance
description: Run OIDC conformance test suite against a deployed environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  conformance:
    name: OIDC Conformance Tests
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run OIDC discovery validation
        run: |
          pytest tests/integration/test_discovery_document.py -v --tb=short

      - name: Run JWKS endpoint validation
        run: |
          pytest tests/integration/test_jwks_endpoint.py -v --tb=short

      - name: Run authorization code flow tests
        run: |
          pytest tests/integration/test_authorization_code_flow.py -v --tb=short

      - name: Run client credentials flow tests
        run: |
          pytest tests/integration/test_client_credentials_flow.py -v --tb=short

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-conformance-results
          path: reports/
