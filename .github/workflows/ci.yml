name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install mise (pinned)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          version: "2026.11.0"

      - name: Install dependencies
        run: mise install && mise run lock-check && mise run deps

      - name: Run Ruff linter and formatter check
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install mise (pinned)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          version: "2026.11.0"

      - name: Install dependencies
        run: mise install && mise run lock-check && mise run deps

      - name: Run tests
        run: mise run test

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install mise (pinned)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          version: "2026.11.0"

      - name: Install dependencies
        run: mise install && mise run lock-check && mise run deps

      - name: Run pre-commit hooks
        run: mise run precommit
