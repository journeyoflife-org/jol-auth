name: Auth Bug Report
description: Report a bug in the authentication or authorization system
title: "[auth-bug]: "
labels: ["bug", "auth"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an auth bug. Please fill in the details below.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Which environment is affected? (development / staging / production)
    validations:
      required: true
  - type: input
    id: tenant
    attributes:
      label: Tenant ID
      description: The tenant ID where the issue was observed (if applicable).
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Traces
      description: Paste relevant log output or distributed trace IDs.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: flow
    attributes:
      label: Affected Auth Flow
      options:
        - Authorization Code
        - Client Credentials
        - Refresh Token
        - Token Revocation
        - Session Management
        - MFA
        - RBAC
        - JWKS / Discovery
        - Other
    validations:
      required: true
