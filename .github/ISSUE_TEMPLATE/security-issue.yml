name: Security Issue
description: Privately report a security vulnerability in jol-auth
title: "[security]: "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **⚠️ If this is a critical vulnerability, please follow the responsible disclosure process in SECURITY.md instead of opening a public issue.**
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the security issue, including the attack scenario.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is the potential impact? (e.g. data breach, privilege escalation, DoS)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide steps to reproduce the issue.
    validations:
      required: true
  - type: input
    id: cve
    attributes:
      label: CVE / Advisory Reference
      description: Link to any related CVE or security advisory.
    validations:
      required: false
