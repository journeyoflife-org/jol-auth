name: Auth Feature Request
description: Propose a new authentication or authorization feature
title: "[auth-feature]: "
labels: ["enhancement", "auth"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please provide enough detail for the team to evaluate the proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the proposed solution or approach.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List any alternative approaches that were considered.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - OAuth 2.0 / OIDC
        - Multi-tenant RBAC
        - Session Management
        - MFA
        - Key Management / JWKS
        - Audit / Compliance
        - API Design
        - Developer Experience
        - Other
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance Impact
      options:
        - label: This feature processes new personal data categories
        - label: This feature introduces a new data transfer path
        - label: A DPIA update may be required (see docs/DPIA-template.md)
